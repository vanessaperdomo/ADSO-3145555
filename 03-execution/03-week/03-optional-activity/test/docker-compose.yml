version: '3.8'

services:
  postgres:
    image: postgres:17
    container_name: cafetinsenafull
    environment:
      POSTGRES_DB: cafetinsena
      POSTGRES_USER: laura
      POSTGRES_PASSWORD: 12345
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: