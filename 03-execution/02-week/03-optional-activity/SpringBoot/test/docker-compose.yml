version: '3.8'

services:
  db:
    image: postgres:15
    container_name: postgres_cafeteria
    environment:
      POSTGRES_DB: cafeteria
      POSTGRES_USER: laura
      POSTGRES_PASSWORD: "12345"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: springboot_app
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/cafeteria
      SPRING_DATASOURCE_USERNAME: laura
      SPRING_DATASOURCE_PASSWORD: "12345"

volumes:
  postgres_data: